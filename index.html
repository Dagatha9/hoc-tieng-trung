<title>Hán Đồ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@500;700;900&family=Ma+Shan+Zheng&display=swap">
<style>
/* Layout: sticky top bar; hash-routed views (home, roadmap, review, history, lesson). Hero with brush hanzi + plum tree growing with XP; seal-red stamps mark passed levels. */
:root{
  --bg:#F1F5F2; --surface:#FFFFFF; --surface2:#E8EFEA; --ink:#14221D; --muted:#566860; --line:#D3DED7;
  --jade:#1B7556; --jade-ink:#FFFFFF; --jade-soft:#DCEEE4; --seal:#BE3228; --seal-soft:#F7E1DE; --gold:#C99A1B;
  --good:#1B7556; --bad:#BE3228;
  --f-ui:'Be Vietnam Pro','Noto Sans',system-ui,sans-serif;
  --f-py:'Noto Sans','Be Vietnam Pro',system-ui,sans-serif;
  --f-han:'Noto Serif SC','Songti SC','SimSun',serif;
  --f-brush:'Ma Shan Zheng','Noto Serif SC',serif;
  --fs:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1815; --surface:#16231F; --surface2:#1D2E28; --ink:#E7F0EB; --muted:#93A69D; --line:#2A3B35;
  --jade:#4FC79B; --jade-ink:#0A1612; --jade-soft:#1B3A2F; --seal:#EA6B5F; --seal-soft:#3A1F1C; --gold:#E3B73B;
  --good:#4FC79B; --bad:#EA6B5F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1815; --surface:#16231F; --surface2:#1D2E28; --ink:#E7F0EB; --muted:#93A69D; --line:#2A3B35;
  --jade:#4FC79B; --jade-ink:#0A1612; --jade-soft:#1B3A2F; --seal:#EA6B5F; --seal-soft:#3A1F1C; --gold:#E3B73B;
  --good:#4FC79B; --bad:#EA6B5F; color-scheme:dark}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);line-height:1.55;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--jade)}
:focus-visible{outline:3px solid var(--jade);outline-offset:2px;border-radius:6px}
.wrap{max-width:1040px;margin:0 auto;min-width:0}
.han{font-family:var(--f-han);font-weight:700}
.py{font-family:var(--f-py)}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.bar .wrap{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
.logo{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink);font-weight:700;font-size:1.15rem}
.logo .mark{font-family:var(--f-brush);font-size:1.7rem;color:var(--seal);line-height:1}
.logo small{font-weight:500;color:var(--muted);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
nav{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto}
nav a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;font-size:.9rem;white-space:nowrap}
nav a[aria-current="page"]{background:var(--jade-soft);color:var(--jade)}
.tools{display:flex;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 9px;font-size:.8rem;font-weight:600;min-width:32px;line-height:1.3}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* generic */
main{padding-block:28px 64px}
h1{font-size:clamp(1.9rem,5.2vw,3rem);line-height:1.12;margin:0 0 14px;letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:normal;color:var(--jade)}
h2{font-size:1.4rem;margin:0 0 6px;text-wrap:balance}
h3{font-size:1.05rem;margin:0 0 4px}
.lead{color:var(--muted);max-width:56ch;margin:0 0 18px}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:11px 18px;font-weight:600;background:var(--jade);color:var(--jade-ink);text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 12px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
/* hero */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;margin-bottom:34px}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin:18px 0 22px}
.stats b{display:block;font-size:1.6rem;line-height:1}
.stats span{font-size:.78rem;color:var(--muted)}
.heroart{position:relative;min-height:260px;border-radius:20px;background:var(--jade-soft);overflow:hidden;display:grid;place-items:center}
.heroart .big{font-family:var(--f-brush);font-size:min(46vw,13rem);line-height:1;color:var(--seal);opacity:.92}
.floater{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.08)}
.floater .han{font-size:1.5rem;display:block;line-height:1.2}
.floater small{font-size:.7rem;color:var(--muted)}
/* tree */
.treebox{display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:22px;align-items:center}
.treebox svg{width:100%;height:auto;max-height:260px}
.stages{list-style:none;padding:0;margin:14px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
.stages li{font-size:.78rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.stages li i{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.stages li.on{color:var(--ink);font-weight:600}
.stages li.on i{background:var(--jade)}
.meter{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:10px 0 6px}
.meter div{height:100%;background:var(--jade);border-radius:99px;transition:width .5s}
/* chooser */
.choose{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.choose a{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;transition:transform .15s,border-color .15s}
.choose a:hover{transform:translateY(-3px);border-color:var(--jade)}
.choose .glyph{font-size:2.6rem;line-height:1;display:block;margin-bottom:10px;color:var(--jade)}
.choose p{margin:6px 0 0;color:var(--muted);font-size:.88rem}
/* roadmap */
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;font-weight:600;font-size:.88rem}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lesson{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;position:relative}
.lesson:hover{border-color:var(--jade)}
.lesson .no{font-size:.72rem;color:var(--muted);font-weight:600;letter-spacing:.08em}
.lesson .count{font-size:.8rem;color:var(--muted)}
.lesson.next{border-color:var(--jade);box-shadow:0 0 0 2px var(--jade-soft)}
.lesson .tag{position:absolute;top:12px;right:12px;font-size:.68rem;background:var(--jade);color:var(--jade-ink);padding:2px 8px;border-radius:99px;font-weight:700}
.stamps{display:flex;gap:6px;margin-top:auto;padding-top:6px}
.stamp{width:34px;height:34px;border-radius:7px;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:.68rem;font-weight:700;color:var(--muted);font-family:var(--f-han)}
.stamp.on{border:2px solid var(--seal);color:var(--seal);background:var(--seal-soft);transform:rotate(-4deg)}
/* study card */
.lessonhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
.crumb{font-size:.85rem;color:var(--muted)}
.crumb a{color:var(--muted)}
.deck{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;max-width:560px;margin:0 auto}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px 22px;min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;cursor:pointer;position:relative;user-select:none}
.flash .pos{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--seal);font-weight:700;background:var(--seal-soft);padding:2px 10px;border-radius:99px}
.flash .zh{font-size:clamp(3.4rem,17vw,5.6rem);line-height:1.15;font-family:var(--f-han);font-weight:700;overflow-wrap:anywhere}
.flash .pinyin{font-family:var(--f-py);font-size:1.3rem;color:var(--jade);font-weight:500}
.flash .mean{font-size:1.5rem;font-weight:700;margin-top:6px}
.flash .exb{margin-top:10px;padding-top:12px;border-top:1px dashed var(--line);width:100%}
.flash .exb .han{font-size:1.2rem}
.flash .exb .py{font-size:.9rem;color:var(--muted)}
.flash .hint{font-size:.78rem;color:var(--muted);margin-top:8px}
.say{border:1px solid var(--line);background:var(--surface2);border-radius:50%;width:40px;height:40px;display:inline-grid;place-items:center}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--jade)}
.dots i.cur{background:var(--seal)}
.pad{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;max-width:560px;margin:14px auto 0;text-align:center}
.padwrap{position:relative;width:min(100%,280px);aspect-ratio:1;margin:8px auto}
.padwrap canvas{width:100%;height:100%;border:2px solid var(--seal);border-radius:6px;background:var(--surface);touch-action:none;display:block}
/* grammar */
.rule{display:grid;grid-template-columns:110px 1fr;gap:4px 14px;padding:12px 0;border-bottom:1px dashed var(--line)}
.rule:last-child{border-bottom:0}
.rule b{color:var(--jade)}
.rule code{font-family:var(--f-han);font-size:1.05rem;background:var(--surface2);padding:1px 8px;border-radius:6px}
.rule .eg{grid-column:2;color:var(--muted);font-size:.92rem}
.note{background:var(--seal-soft);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:.92rem}
.exrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.exrow .han{font-size:1.4rem}
.exrow .py{font-size:.9rem;color:var(--muted)}
/* levels */
.levels{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:18px}
.lv{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.lv:hover{border-color:var(--jade)}
.lv b{font-size:1.05rem}
.lv span{font-size:.82rem;color:var(--muted)}
.lv .best{color:var(--seal);font-weight:700}
/* quiz */
.quiz{max-width:640px;margin:0 auto}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-size:.85rem;color:var(--muted)}
.qprompt{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px;text-align:center;margin-bottom:14px}
.qprompt .q{font-size:.85rem;color:var(--muted);margin-bottom:6px}
.qprompt .zh{font-family:var(--f-han);font-weight:700;font-size:clamp(2.6rem,12vw,4rem);line-height:1.2;overflow-wrap:anywhere}
.qprompt .mean{font-size:1.45rem;font-weight:700}
.qprompt .sub{font-family:var(--f-py);color:var(--jade);margin-top:4px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;text-align:left;font-weight:600;min-width:0;overflow-wrap:anywhere}
.opt.han2{font-family:var(--f-han);font-size:1.6rem;text-align:center;padding:10px}
.opt:hover:not([disabled]){border-color:var(--jade)}
.opt.ok{border-color:var(--good);background:var(--jade-soft)}
.opt.no{border-color:var(--bad);background:var(--seal-soft)}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:.95rem}
.fb.ok{background:var(--jade-soft)}
.fb.no{background:var(--seal-soft)}
.fb .han{font-size:1.15rem}
.typebox{display:flex;gap:10px;flex-wrap:wrap}
.typebox input{flex:1;min-width:0;font:inherit;font-family:var(--f-py);font-size:1.15rem;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.slots,.bank{display:flex;gap:8px;flex-wrap:wrap;min-height:52px;padding:8px;border-radius:12px;align-items:center}
.slots{border:1.5px dashed var(--line);background:var(--surface);margin-bottom:12px}
.tok{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-family:var(--f-han);font-weight:700;font-size:1.3rem}
.tok:hover{border-color:var(--jade)}
.result{text-align:center;max-width:480px;margin:20px auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 20px}
.bigstamp{width:112px;height:112px;margin:0 auto 12px;border:4px solid var(--seal);color:var(--seal);border-radius:14px;display:grid;place-items:center;font-family:var(--f-han);font-weight:900;font-size:3.2rem;transform:rotate(-7deg);background:var(--seal-soft)}
.bigstamp.fail{border-color:var(--muted);color:var(--muted);background:var(--surface2)}
.score{font-size:2.2rem;font-weight:700}
/* history / review */
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tw{overflow-x:auto}
.empty{text-align:center;color:var(--muted);padding:34px 14px;border:1.5px dashed var(--line);border-radius:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:.88rem;font-weight:600;z-index:50;max-width:90vw}
.syncnote{font-size:.78rem;color:var(--muted);margin-top:10px}
@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .treebox{grid-template-columns:1fr}
  .treebox svg{max-height:200px}
  .rule{grid-template-columns:1fr}
  .rule .eg{grid-column:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div class="bar"><div class="wrap">
  <a class="logo" href="#home"><span class="mark" aria-hidden="true">汉</span>Hán Đồ<small>HSK 1</small></a>
  <nav aria-label="Điều hướng">
    <a href="#home" data-r="home">Trang chủ</a>
    <a href="#roadmap" data-r="roadmap">Lộ trình</a>
    <a href="#review" data-r="review">Ôn tập</a>
    <a href="#history" data-r="history">Lịch sử</a>
  </nav>
  <div class="tools">
    <button class="chip" data-act="size" data-v="s" aria-pressed="false" aria-label="Cỡ chữ nhỏ">S</button>
    <button class="chip" data-act="size" data-v="m" aria-pressed="true" aria-label="Cỡ chữ vừa">M</button>
    <button class="chip" data-act="size" data-v="l" aria-pressed="false" aria-label="Cỡ chữ lớn">L</button>
    <button class="chip" id="pybtn" data-act="py" aria-pressed="true" title="Hiện pinyin ở mặt trước thẻ">拼</button>
    <button class="chip" id="themebtn" data-act="theme" aria-label="Đổi giao diện sáng tối">◐</button>
  </div>
</div></div>
<main class="wrap" id="app"></main>
<script>
// Từ vựng: "hán tự|pinyin|nghĩa|loại từ|ví dụ|pinyin ví dụ|nghĩa ví dụ"
const VOCAB_RAW = [
{id:"v1",title:"Chào hỏi",sub:"Những câu đầu tiên mỗi ngày",w:[
"你好|nǐ hǎo|xin chào|cụm từ|你好，老师！|Nǐ hǎo, lǎoshī!|Chào thầy/cô ạ!",
"您|nín|ngài, bạn (kính trọng)|đại từ|您好！|Nín hǎo!|Chào ngài!",
"谢谢|xièxie|cảm ơn|động từ|谢谢你。|Xièxie nǐ.|Cảm ơn bạn.",
"不客气|bú kèqi|đừng khách sáo|cụm từ|不客气！|Bú kèqi!|Đừng khách sáo!",
"对不起|duìbuqǐ|xin lỗi|cụm từ|对不起，我来晚了。|Duìbuqǐ, wǒ lái wǎn le.|Xin lỗi, tôi đến muộn.",
"没关系|méi guānxi|không sao|cụm từ|没关系。|Méi guānxi.|Không sao đâu.",
"再见|zàijiàn|tạm biệt|động từ|老师，再见！|Lǎoshī, zàijiàn!|Tạm biệt thầy/cô!",
"请|qǐng|mời, xin vui lòng|động từ|请喝茶。|Qǐng hē chá.|Mời uống trà.",
"好|hǎo|tốt, khỏe|tính từ|我很好。|Wǒ hěn hǎo.|Tôi khỏe.",
"吗|ma|…không? (trợ từ nghi vấn)|trợ từ|你好吗？|Nǐ hǎo ma?|Bạn khỏe không?"]},
{id:"v2",title:"Đại từ & từ để hỏi",sub:"Tôi, bạn, anh ấy, cái gì, ai",w:[
"我|wǒ|tôi|đại từ|我是学生。|Wǒ shì xuésheng.|Tôi là học sinh.",
"你|nǐ|bạn|đại từ|你好吗？|Nǐ hǎo ma?|Bạn khỏe không?",
"他|tā|anh ấy|đại từ|他是老师。|Tā shì lǎoshī.|Anh ấy là giáo viên.",
"她|tā|cô ấy|đại từ|她是我朋友。|Tā shì wǒ péngyou.|Cô ấy là bạn tôi.",
"我们|wǒmen|chúng tôi, chúng ta|đại từ|我们都是学生。|Wǒmen dōu shì xuésheng.|Chúng tôi đều là học sinh.",
"你们|nǐmen|các bạn|đại từ|你们好！|Nǐmen hǎo!|Chào các bạn!",
"他们|tāmen|họ, các anh ấy|đại từ|他们在家。|Tāmen zài jiā.|Họ ở nhà.",
"这|zhè|đây, này|đại từ|这是水。|Zhè shì shuǐ.|Đây là nước.",
"那|nà|kia, đó|đại từ|那是我家。|Nà shì wǒ jiā.|Kia là nhà tôi.",
"谁|shéi|ai|đại từ|他是谁？|Tā shì shéi?|Anh ấy là ai?",
"什么|shénme|cái gì|đại từ|这是什么？|Zhè shì shénme?|Đây là cái gì?"]},
{id:"v3",title:"Gia đình & con người",sub:"Bố, mẹ, bạn bè, thầy cô",w:[
"爸爸|bàba|bố, ba|danh từ|我爸爸是医生。|Wǒ bàba shì yīshēng.|Bố tôi là bác sĩ.",
"妈妈|māma|mẹ|danh từ|我妈妈在家。|Wǒ māma zài jiā.|Mẹ tôi ở nhà.",
"儿子|érzi|con trai|danh từ|他有一个儿子。|Tā yǒu yí ge érzi.|Anh ấy có một con trai.",

/* ===== Core: parse data, state, persistence, helpers ===== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);

const LESSONS=[];
VOCAB_RAW.forEach(l=>LESSONS.push({id:l.id,type:'vocab',title:l.title,sub:l.sub,
  items:l.w.map((s,i)=>{const a=s.split('|');return{k:l.id+':'+i,zh:a[0],py:a[1],vi:a[2],pos:a[3],ex:{zh:a[4],py:a[5],vi:a[6]}}})}));
RAD_RAW.forEach(l=>LESSONS.push({id:l.id,type:'rad',title:l.title,sub:l.sub,
  items:l.w.map((s,i)=>{const a=s.split('|');return{k:l.id+':'+i,zh:a[0],py:a[1],han:a[2],vi:a[3],
    ex:a[4].split(';').map(e=>{const b=e.split(':');return{zh:b[0],py:b[1],vi:b[2]}})}})}));
GRAM.forEach(l=>LESSONS.push({id:l.id,type:'gram',title:l.title,sub:l.sub,rules:l.rules,note:l.note,
  items:l.ex.map((s,i)=>{const a=s.split('|');const t=a[0].split(' ');
    return{k:l.id+':'+i,tokens:t,zh:t.join(''),py:a[1],vi:a[2],b:+a[3],p:a[4],d:a[5].split('/')}})}));
const BY={};const ITEM={};
LESSONS.forEach(L=>{BY[L.id]=L;L.items.forEach((it,i)=>{ITEM[it.k]={L,it,i}})});
const PATH=['v1','v2','g1','v3','r1','v4','g2','v5','v6','g3','r2','v7','v8','g4','v9','r3','v10','g5','v11','v12','g6','r4','v13','g7','g8'];
const TYPE_NAME={vocab:'Từ vựng',rad:'Bộ thủ',gram:'Ngữ pháp'};
const UNIT={vocab:'từ',rad:'bộ thủ',gram:'câu'};
const LV_NAME=['','Dễ','Vừa','Khó'];
const LV_CH=['','易','中','难'];

  vocab:['','Nhìn chữ Hán, chọn nghĩa','Đọc nghĩa, chọn chữ Hán','Điền câu, gõ pinyin'],
  rad:['','Nhìn bộ thủ, chọn nghĩa','Đọc nghĩa, chọn bộ thủ','Chữ này chứa bộ thủ nào?'],
  gram:['','Đọc câu, chọn nghĩa','Điền từ còn thiếu','Sắp xếp các từ thành câu']};
const STAGES=[['Hạt giống',0],['Nảy mầm',80],['Lên thân',200],['Phân cành',380],['Ra lá',620],['Nở hoa',900]];
const XP_STUDY=10,XP_LEVEL=10,PASS=0.7;

/* ===== state ===== */
const LS='handu.v1';
let S={xp:0,done:{},wrong:{},hist:[],py:true,fs:'m',theme:'auto',tab:'path',u:0};
try{const r=localStorage.getItem(LS);if(r)Object.assign(S,JSON.parse(r))}catch(e){}
let dbDoc=null,dbTimer=null,dbState='local';
function applyPrefs(){
  const px={s:'14px',m:'16px',l:'19px'}[S.fs]||'16px';
  document.documentElement.style.setProperty('--fs',px);
  const r=document.documentElement;
  if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme);
}
function save(){
  S.u=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  if(dbDoc){clearTimeout(dbTimer);dbTimer=setTimeout(async()=>{
    try{await dbDoc.set({json:JSON.stringify(S),u:S.u});dbState='cloud'}catch(e){dbState='local'}
    const n=$('#syncnote');if(n)n.textContent=syncText();
  },800)}
}
function syncText(){return dbState==='cloud'?'Tiến độ đang được lưu trong tài khoản của bạn, dùng được trên mọi thiết bị.':'Tiến độ lưu trên trình duyệt này.'}
async function initCloud(){
  try{
    if(!window.claude||!claude.use)return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    dbDoc=db.doc('data/users/'+id+'/progress');
    const snap=await dbDoc.get();
    if(snap.exists){
      const d=snap.data();let remote=null;try{remote=JSON.parse(d.json)}catch(e){}
      if(remote&&(remote.u||0)>(S.u||0)){S=Object.assign({xp:0,done:{},wrong:{},hist:[],py:true,fs:'m',theme:'auto',tab:'path',u:0},remote);
        try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
        applyPrefs();route()}
      else if(S.u>(remote?remote.u:0)){save()}
    }else if(S.xp>0||Object.keys(S.done).length){save()}
    dbState='cloud';const n=$('#syncnote');if(n)n.textContent=syncText();
  }catch(e){dbDoc=null}
}

/* ===== helpers ===== */
const D=id=>S.done[id]||(S.done[id]={study:false,best:{}});
const isStudied=id=>!!(S.done[id]&&S.done[id].study);
const lvPassed=(id,l)=>!!(S.done[id]&&S.done[id].best&&S.done[id].best[l]>=PASS);
const lessonXP=id=>{const d=S.done[id];if(!d)return 0;return(d.study?XP_STUDY:0)+[1,2,3].filter(l=>d.best&&d.best[l]>=PASS).length*XP_LEVEL};
function stageIdx(){let s=0;STAGES.forEach((x,i)=>{if(S.xp>=x[1])s=i});return s}
function nextLesson(){
  for(const id of PATH){if(!isStudied(id))return id}
  for(const id of PATH){for(const l of[1,2,3])if(!lvPassed(id,l))return id}
  return null;
}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function speak(text){
  try{
    if(!('speechSynthesis' in window)){toast('Thiết bị chưa hỗ trợ phát âm');return}
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.8;
    const v=speechSynthesis.getVoices().find(v=>/zh[-_]CN|cmn/i.test(v.lang));if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){toast('Không phát được âm thanh')}
}
const normPy=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/ü/g,'u').replace(/v/g,'u').replace(/[^a-z]/g,'');

function treeSVG(st){
  const brown='#7A5A3C';
  let g=`<ellipse cx="100" cy="222" rx="78" ry="9" fill="var(--line)"/>`;
  if(st===0)g+=`<ellipse cx="100" cy="214" rx="9" ry="6" fill="${brown}"/><path d="M96 211q4-4 8 0" stroke="var(--surface)" stroke-width="1.5" fill="none"/>`;
  if(st===1)g+=`<path d="M100 220V178" stroke="var(--jade)" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M100 188q-24-4-26-22 20 0 26 22z" fill="var(--jade)"/><path d="M100 180q22-2 26-20-20-2-26 20z" fill="var(--jade)"/>`;
  if(st>=2)g+=`<path d="M100 222C101 190 97 150 100 112" stroke="${brown}" stroke-width="${st>=3?11:8}" fill="none" stroke-linecap="round"/>`;
  if(st>=3)g+=`<g stroke="${brown}" stroke-width="5" fill="none" stroke-linecap="round"><path d="M100 160Q78 150 58 128"/><path d="M100 140Q124 128 146 104"/><path d="M99 120Q86 98 84 70"/><path d="M100 112Q112 88 120 62"/></g>`;

const AMB={'明':['日','月'],'好':['女','子'],'桌':['木','日'],'累':['田','纟'],'汉':['氵']};
function distract(L,it,get,n){
  const own=get(it);
  let pool=L.items.filter(x=>x!==it&&get(x)!==own);
  const extra=LESSONS.filter(l=>l.type===L.type&&l!==L).flatMap(l=>l.items);
  pool=pool.concat(shuffle(extra));
  const seen=new Set([own]),out=[];
  for(const x of shuffle(pool.slice(0,L.items.length)).concat(pool.slice(L.items.length))){
    const v=get(x);if(v==null||seen.has(v))continue;seen.add(v);out.push(v);if(out.length>=n)break;
  }
  return out;
}
function mkQ(L,it,lv){
  if(L.type==='vocab'){
    const fb=`<span class="han">${esc(it.zh)}</span> <span class="py">${esc(it.py)}</span> · ${esc(it.vi)}<br><span class="han">${esc(it.ex.zh)}</span> <span class="py">${esc(it.ex.py)}</span> · ${esc(it.ex.vi)}`;
    if(lv===1)return{kind:'mc',key:it.k,q:'Chọn nghĩa đúng',zh:it.zh,sub:it.py,say:it.zh,
      opts:shuffle([it.vi,...distract(L,it,x=>x.vi,3)]),ans:it.vi,fb};
    if(lv===2)return{kind:'mc',key:it.k,q:'Chọn chữ Hán phù hợp',mean:it.vi,sub:it.pos,
      opts:shuffle([it.zh,...distract(L,it,x=>x.zh,3)]),han:true,ans:it.zh,fb};
    const masked=it.ex.zh.includes(it.zh)&&it.ex.zh.replace(it.zh,'').replace(/[。！？，、\s]/g,'').length>0;
    return{kind:'type',key:it.k,q:'Gõ pinyin của từ còn thiếu (không cần dấu thanh)',
      zh:masked?it.ex.zh.replace(it.zh,'＿＿'):null,mean:masked?it.ex.vi:it.vi,sub:masked?'':it.pos,
      ans:it.py,accept:normPy(it.py),say:it.zh,fb};
  }
  if(L.type==='rad'){
    const fb=`<span class="han">${esc(it.zh)}</span> · bộ <b>${esc(it.han)}</b> · ${esc(it.vi)}<br>`+it.ex.map(e=>`<span class="han">${esc(e.zh)}</span> ${esc(e.py)}`).join(' · ');
    if(lv===1)return{kind:'mc',key:it.k,q:'Bộ thủ này mang nghĩa gì?',zh:it.zh,sub:it.py,
      opts:shuffle([it.vi,...distract(L,it,x=>x.vi,3)]),ans:it.vi,fb};
    if(lv===2)return{kind:'mc',key:it.k,q:'Chọn bộ thủ có nghĩa này',mean:it.vi,sub:'Hán Việt: '+it.han,
      opts:shuffle([it.zh,...distract(L,it,x=>x.zh,3)]),han:true,ans:it.zh,fb};
    const e=pick(it.ex,1)[0];
    const ok=new Set([it.zh,...(AMB[e.zh]||[])]);
    L.items.forEach(x=>{if(x!==it&&x.ex.some(y=>y.zh===e.zh))ok.add(x.zh)});
    const dis=distract(L,it,x=>x.zh,6).filter(z=>!ok.has(z)).slice(0,3);
    return{kind:'mc',key:it.k,q:'Chữ này chứa bộ thủ nào?',zh:e.zh,sub:e.py+' · '+e.vi,say:e.zh,
      opts:shuffle([it.zh,...dis]),han:true,ans:it.zh,okSet:[...ok],fb};
  }
  const sent=it.tokens.join('')+it.p;
  const fb=`<span class="han">${esc(sent)}</span><br><span class="py">${esc(it.py)}</span> · ${esc(it.vi)}`;
  if(lv===1){
    const others=LESSONS.filter(l=>l.type==='gram').flatMap(l=>l.items).filter(x=>x!==it&&x.vi!==it.vi);
    return{kind:'mc',key:it.k,q:'Câu này có nghĩa là gì?',zh:sent,sub:it.py,say:sent,
      opts:shuffle([it.vi,...pick(others,3).map(x=>x.vi)]),ans:it.vi,fb};
  }
  if(lv===2){
    const t=it.tokens.slice();const a=t[it.b];t[it.b]='＿＿';
    return{kind:'mc',key:it.k,q:'Điền từ còn thiếu',zh:t.join('')+it.p,mean:it.vi,
      opts:shuffle([a,...it.d]),han:true,ans:a,fb};
  }
  let sh=shuffle(it.tokens);let n=0;while(sh.join()===it.tokens.join()&&n++<10)sh=shuffle(it.tokens);
  return{kind:'order',key:it.k,q:'Sắp xếp các từ thành câu đúng',mean:it.vi,sub:it.py,
    tokens:sh,target:it.tokens,p:it.p,ans:sent,fb};
}
function buildQuiz(L,lv){
  const items=L.type==='gram'?L.items:pick(L.items,Math.min(10,L.items.length));
  return items.map(it=>mkQ(L,it,lv));
}

}

  box.innerHTML=`<div class="pad"><div class="row" style="justify-content:center">${cs.map((c,i)=>`<button class="chip han" style="font-size:1.2rem;padding:4px 12px" data-act="padch" data-i="${i}" aria-pressed="${i===ST.pc}">${esc(c)}</button>`).join('')}</div>
    <div class="padwrap"><canvas id="padc" aria-label="Ô tập viết chữ Hán"></canvas></div>
    <p class="hint" style="font-size:.8rem;color:var(--muted);margin:0 0 8px">Viết bằng ngón tay hoặc chuột, đi từ trên xuống dưới, từ trái sang phải.</p>
    <div class="row" style="justify-content:center"><button class="btn ghost small" data-act="padclear">Xóa nét</button><button class="btn ghost small" data-act="padghost">${PAD.ghost?'Ẩn':'Hiện'} chữ mẫu</button><button class="btn ghost small" data-act="pad">Đóng</button></div></div>`;
  requestAnimationFrame(()=>setupPad(cs[ST.pc]));
}
function setupPad(ch){
  const c=$('#padc');if(!c||!ch)return;
  const r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1,W=r.width;
  c.width=Math.round(W*dpr);c.height=Math.round(W*dpr);
  const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
  const cs=getComputedStyle(document.documentElement);
  const ink=cs.getPropertyValue('--ink').trim()||'#000',seal=cs.getPropertyValue('--seal').trim()||'#c00';
  function bg(){
    x.clearRect(0,0,W,W);x.strokeStyle=seal;x.globalAlpha=.35;x.lineWidth=1;x.setLineDash([5,5]);
    x.beginPath();x.moveTo(W/2,0);x.lineTo(W/2,W);x.moveTo(0,W/2);x.lineTo(W,W/2);x.moveTo(0,0);x.lineTo(W,W);x.moveTo(W,0);x.lineTo(0,W);x.stroke();
    x.setLineDash([]);x.globalAlpha=1;
    if(PAD.ghost){x.fillStyle=ink;x.globalAlpha=.14;x.font=`700 ${W*.8}px "Noto Serif SC","Songti SC",serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(ch,W/2,W/2+W*.04);x.globalAlpha=1}
  }
  bg();
  try{if(document.fonts&&document.fonts.load)document.fonts.load('700 40px "Noto Serif SC"',ch).then(bg).catch(()=>{})}catch(e){}
  let on=false,lx=0,ly=0;
  const pos=e=>{const b=c.getBoundingClientRect();return[(e.clientX-b.left)*(W/b.width),(e.clientY-b.top)*(W/b.height)]};
  x.lineCap='round';x.lineJoin='round';
  c.onpointerdown=e=>{on=true;try{c.setPointerCapture(e.pointerId)}catch(_){}[lx,ly]=pos(e);x.strokeStyle=ink;x.lineWidth=Math.max(5,W/38);x.beginPath();x.moveTo(lx,ly);x.lineTo(lx+.1,ly+.1);x.stroke();e.preventDefault()};
  c.onpointermove=e=>{if(!on)return;const[px,py]=pos(e);x.strokeStyle=ink;x.lineWidth=Math.max(5,W/38);x.beginPath();x.moveTo(lx,ly);x.lineTo(px,py);x.stroke();lx=px;ly=py;e.preventDefault()};
  const end=()=>{on=false};c.onpointerup=end;c.onpointercancel=end;c.onpointerleave=end;
}
/* ===== Quiz views + events + router ===== */
let QZ=null;
function startQuiz(L,lv){QZ={L,lv,qs:buildQuiz(L,lv),i:0,score:0,mode:'lesson',answered:false,res:null,chosen:null,placed:[],typed:'',fin:null}}
function startReview(){const r=buildReview();QZ={L:null,lv:0,label:r.label,qs:r.qs,i:0,score:0,mode:'review',answered:false,res:null,chosen:null,placed:[],typed:'',fin:null}}
function vQuiz(){
  const z=QZ;if(z.fin)return vResult();
  const q=z.qs[z.i],n=z.qs.length;
  const title=z.mode==='lesson'?`${esc(z.L.title)} · ${LV_NAME[z.lv]}`:esc(z.label);
  let h=`<div class="quiz"><div class="qtop"><span>${title}</span><span class="py">Câu ${z.i+1}/${n}</span></div>
    <div class="meter"><div style="width:${Math.round(z.i/n*100)}%"></div></div>
    <div class="qprompt"><div class="q">${esc(q.q)}</div>
    ${q.zh?`<div class="zh">${esc(q.zh)}</div>`:''}${q.mean?`<div class="mean">${esc(q.mean)}</div>`:''}${q.sub?`<div class="sub">${esc(q.sub)}</div>`:''}
    ${q.say?`<button class="say" style="margin-top:10px" data-act="say" data-t="${esc(q.say)}" aria-label="Nghe">${SPK}</button>`:''}</div>`;
  if(q.kind==='mc'){
    h+=`<div class="opts">${q.opts.map((o,i)=>{let c='opt'+(q.han?' han2':'');
      if(z.answered){const isAns=q.okSet?q.okSet.includes(o):o===q.ans;if(isAns)c+=' ok';else if(i===z.chosen)c+=' no'}
      return `<button class="${c}" data-act="opt" data-i="${i}" ${z.answered?'disabled':''}>${esc(o)}</button>`}).join('')}</div>`;
  }else if(q.kind==='type'){
    h+=`<div class="typebox"><input id="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ví dụ: nǐ hǎo hoặc ni hao" value="${esc(z.typed)}" ${z.answered?'disabled':''}>
    ${z.answered?'':'<button class="btn" data-act="check">Kiểm tra</button>'}</div>`;
  }else{
    const placed=z.placed.map(i=>q.tokens[i]);
    h+=`<div class="slots" aria-label="Câu của bạn">${z.placed.map((ti,k)=>`<button class="tok" data-act="slot" data-k="${k}" ${z.answered?'disabled':''}>${esc(q.tokens[ti])}</button>`).join('')}${z.placed.length?`<span class="han" style="font-size:1.3rem">${esc(q.p)}</span>`:'<span class="hint" style="color:var(--muted);font-size:.85rem">Chạm vào các từ bên dưới theo thứ tự</span>'}</div>
    <div class="bank">${q.tokens.map((t,i)=>z.placed.includes(i)?'':`<button class="tok" data-act="tok" data-i="${i}" ${z.answered?'disabled':''}>${esc(t)}</button>`).join('')}</div>
    ${z.answered?'':`<div style="margin-top:12px"><button class="btn" data-act="check" ${z.placed.length===q.tokens.length?'':'disabled'}>Kiểm tra</button></div>`}`;
  }
  if(z.answered){
    h+=`<div class="fb ${z.res?'ok':'no'}"><b>${z.res?'Chính xác!':'Chưa đúng.'}</b>${z.res?'':` Đáp án: <span class="${q.han||q.kind==='order'?'han':'py'}">${esc(q.kind==='order'?q.ans:q.ans)}</span>`}<br>${q.fb}</div>
    <div style="margin-top:12px"><button class="btn" data-act="nextq">${z.i+1<n?'Câu tiếp theo →':'Xem kết quả'}</button></div>`;
  }
  return h+`<p style="margin-top:22px"><a href="${z.mode==='lesson'?'#l-'+z.L.id:'#review'}" class="crumb">Thoát bài tập</a></p></div>`;
}
function answerQ(ok){
  const z=QZ,q=z.qs[z.i];z.answered=true;z.res=ok;
  if(ok){z.score++;if(z.mode==='review')delete S.wrong[q.key]}else S.wrong[q.key]=(S.wrong[q.key]||0)+1;
  save();renderQuiz();
}
function renderQuiz(){app().innerHTML=vQuiz();const i=$('#ans');if(i&&!QZ.answered)i.focus()}
function finishQuiz(){
  const z=QZ,n=z.qs.length,pct=z.score/n,passed=pct>=PASS;let gain=0;
  if(z.mode==='lesson'){
    const d=D(z.L.id);const prev=d.best[z.lv]||0;
    if(passed&&prev<PASS){gain=XP_LEVEL;S.xp+=gain}
    if(pct>prev)d.best[z.lv]=pct;
    S.hist.push({t:Date.now(),title:z.L.title,lv:z.lv,sc:z.score,tot:n});
  }else S.hist.push({t:Date.now(),title:'Ôn tập',lv:0,sc:z.score,tot:n});
  S.hist=S.hist.slice(-200);save();
  z.fin={pct,passed,gain};
}
function vResult(){
  const z=QZ,f=z.fin,n=z.qs.length;
  let btns;
  if(z.mode==='lesson'){
    btns=`<button class="btn" data-act="retry">Làm lại</button>
    ${z.lv<3&&f.passed?`<a class="btn ghost" href="#q-${z.L.id}-${z.lv+1}">Mức ${LV_NAME[z.lv+1]} →</a>`:''}
    <a class="btn ghost" href="#l-${z.L.id}">Về bài học</a><a class="btn ghost" href="#roadmap">Lộ trình</a>`;
  }else btns=`<button class="btn" data-act="review">Ôn tiếp</button><a class="btn ghost" href="#review">Về trang ôn tập</a>`;
  return `<div class="result"><div class="bigstamp ${f.passed?'':'fail'}">${f.passed?'合格':'加油'}</div>
  <div class="score">${z.score}/${n}</div>
  <p class="lead" style="margin:6px auto 14px">${f.passed?'Bạn đã đạt. Chữ đỏ này là con dấu của bạn.':'Chưa đạt 70%. Xem lại thẻ từ rồi thử lại, bạn sẽ nhớ nhanh hơn.'}</p>
  ${f.gain?`<p><b style="color:var(--seal)">+${f.gain} XP</b> · tổng ${S.xp} XP</p>`:''}
  <div class="row" style="justify-content:center;margin-top:12px">${btns}</div></div>`;
}

/* ===== events ===== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const a=el.dataset.act,h=(location.hash||'#home').slice(1),parts=h.split('-');
  const L=parts[0]==='l'?BY[parts[1]]:null;
  if(a==='tab'){S.tab=el.dataset.tab;save();if(h==='roadmap')route();return}
  if(a==='size'){S.fs=el.dataset.v;save();applyPrefs();syncTools();return}
  if(a==='theme'){S.theme={auto:'light',light:'dark',dark:'auto'}[S.theme];save();applyPrefs();syncTools();toast({auto:'Giao diện theo thiết bị',light:'Giao diện sáng',dark:'Giao diện tối'}[S.theme]);if(ST.pad&&L)renderPad(L);return}
  if(a==='py'){S.py=!S.py;save();syncTools();if(L&&L.type!=='gram')renderDeck(L);return}
  if(a==='say'){speak(el.dataset.t);return}
  if(L){
    if(a==='flip'){ST.f=!ST.f;renderDeck(L)}
    else if(a==='prev'||a==='next'){ST.c+=a==='next'?1:-1;ST.f=false;ST.max=Math.max(ST.max,ST.c);renderDeck(L);renderPad(L)}
    else if(a==='pad'){ST.pad=!ST.pad;renderPad(L)}
    else if(a==='padch'){ST.pc=+el.dataset.i;renderPad(L)}
    else if(a==='padclear'){setupPad(padChars(L)[ST.pc])}
    else if(a==='padghost'){PAD.ghost=!PAD.ghost;renderPad(L)}
    else if(a==='complete'){
      const d=D(L.id);if(!d.study){d.study=true;S.xp+=XP_STUDY;save();toast('+'+XP_STUDY+' XP · bài học hoàn thành')}
      const x=$('#xpchip');if(x)x.textContent=lessonXP(L.id)+'/40 XP';
      const cb=$('#completebox');if(cb)cb.innerHTML=completeBtn(L);
    }
    return;
  }
  if(QZ&&(parts[0]==='q'||h==='qr')){
    const q=QZ.qs[QZ.i];
    if(a==='opt'&&!QZ.answered){QZ.chosen=+el.dataset.i;const o=q.opts[QZ.chosen];answerQ(q.okSet?q.okSet.includes(o):o===q.ans)}
    else if(a==='check'&&!QZ.answered){
      if(q.kind==='type'){const v=($('#ans')||{}).value||'';QZ.typed=v;if(!normPy(v))return;answerQ(normPy(v)===q.accept)}
      else if(q.kind==='order'){answerQ(QZ.placed.map(i=>q.tokens[i]).join('|')===q.target.join('|'))}
    }
    else if(a==='tok'&&!QZ.answered){QZ.placed.push(+el.dataset.i);renderQuiz()}
    else if(a==='slot'&&!QZ.answered){QZ.placed.splice(+el.dataset.k,1);renderQuiz()}
    else if(a==='nextq'){QZ.i++;QZ.answered=false;QZ.res=null;QZ.chosen=null;QZ.placed=[];QZ.typed='';if(QZ.i>=QZ.qs.length)finishQuiz();renderQuiz()}
    else if(a==='retry'){startQuiz(QZ.L,QZ.lv);renderQuiz();window.scrollTo(0,0)}
    else if(a==='review'){startReview();if(!QZ.qs.length){location.hash='#review';return}renderQuiz();window.scrollTo(0,0)}
    return;
  }
  if(a==='review'){startReview();if(!QZ.qs.length){toast('Chưa có mục nào để ôn');return}location.hash='#qr';if(h==='qr'){renderQuiz()}return}
  if(a==='reset1'){$('#resetbox').innerHTML=`<p style="margin:0 0 8px">Xóa hết XP, dấu và lịch sử? Không thể hoàn tác.</p><button class="btn small" style="background:var(--seal);color:#fff" data-act="reset2">Xóa tất cả</button> <button class="btn ghost small" data-act="reset3">Giữ lại</button>`;return}
  if(a==='reset3'){$('#resetbox').innerHTML=`<button class="btn ghost small" data-act="reset1">Xóa toàn bộ tiến độ</button>`;return}
  if(a==='reset2'){const keep={py:S.py,fs:S.fs,theme:S.theme};S=Object.assign({xp:0,done:{},wrong:{},hist:[],tab:'path',u:0},keep);save();toast('Đã xóa tiến độ');route();return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.id==='ans'&&QZ&&!QZ.answered){const v=e.target.value;QZ.typed=v;if(!normPy(v))return;const q=QZ.qs[QZ.i];answerQ(normPy(v)===q.accept);return}
  if(e.target&&(e.target.tagName==='INPUT'))return;
  const h=(location.hash||'').slice(1).split('-');const L=h[0]==='l'?BY[h[1]]:null;
  if(L&&L.type!=='gram'){
    if(e.key==='ArrowRight'&&ST.c<L.items.length-1){ST.c++;ST.f=false;ST.max=Math.max(ST.max,ST.c);renderDeck(L);renderPad(L)}
    else if(e.key==='ArrowLeft'&&ST.c>0){ST.c--;ST.f=false;renderDeck(L);renderPad(L)}
    else if((e.key===' '||e.key==='Enter')&&e.target.classList&&e.target.classList.contains('flash')){e.preventDefault();ST.f=!ST.f;renderDeck(L)}
  }
});

/* ===== router ===== */
function syncTools(){
  document.querySelectorAll('[data-act="size"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===S.fs)));
  const p=$('#pybtn');if(p)p.setAttribute('aria-pressed',String(S.py));
  const t=$('#themebtn');if(t)t.textContent={auto:'◐',light:'☀',dark:'☾'}[S.theme];
}
function route(){
  const h=(location.hash||'#home').slice(1),parts=h.split('-');
  let cur='home';
  if(h==='home'||h===''){app().innerHTML=vHome()}
  else if(h==='roadmap'){cur='roadmap';app().innerHTML=vRoadmap()}
  else if(h==='review'){cur='review';app().innerHTML=vReview()}
  else if(h==='history'){cur='history';app().innerHTML=vHistory()}
  else if(parts[0]==='l'&&BY[parts[1]]){cur='roadmap';ST={c:0,f:false,pad:false,pc:0,max:0};renderLesson(BY[parts[1]])}
  else if(parts[0]==='q'&&BY[parts[1]]&&[1,2,3].includes(+parts[2])){cur='roadmap';startQuiz(BY[parts[1]],+parts[2]);renderQuiz()}
  else if(h==='qr'){cur='review';if(!QZ||QZ.mode!=='review'||QZ.fin)startReview();if(!QZ.qs.length){location.hash='#review';return}renderQuiz()}
  else{app().innerHTML=vHome()}
  document.querySelectorAll('nav a').forEach(a=>{if(a.dataset.r===cur)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  window.scrollTo(0,0);syncTools();
}
window.addEventListener('hashchange',route);
applyPrefs();route();initCloud();
try{if('speechSynthesis' in window)speechSynthesis.getVoices()}catch(e){}
</script>
